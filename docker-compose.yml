# Local development stack: MongoDB + the diary.
#
# Both published ports bind to 127.0.0.1, so nothing is reachable from the
# local network. The app reaches Mongo over the compose network on the `mongo`
# hostname; the database publish is only a convenience for mongosh.
#
#   printf 'MONGO_PASSWORD=%s\nDIARY_PASSWORD=%s\n' \
#     "$(openssl rand -hex 16)" "$(openssl rand -base64 18)" > .env
#   docker compose up --build
#   open http://localhost:3000   # log in as DIARY_USERNAME

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-diary}
      # No default: compose refuses to start until this is set in .env.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: diary
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USERNAME:-diary}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/diary?authSource=admin
      # The diary is single-user: these are the Basic auth credentials.
      DIARY_USERNAME: ${DIARY_USERNAME:-me}
      DIARY_PASSWORD: ${DIARY_PASSWORD:?set DIARY_PASSWORD in .env}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mongodata:
